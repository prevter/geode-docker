name: Build Docker Images

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
        geode_version:
          description: "Geode SDK version (latest, nightly, or specific tag)"
          required: true
          default: "latest"

jobs:
  version:
    name: Resolve Geode SDK Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.geode.outputs.version }}
      update_latest: ${{ steps.geode.outputs.update_latest }}
    steps:
      - name: Resolve Geode SDK version
        id: geode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.geode_version }}"
          else
            VERSION="latest"
          fi
 
          if [ "${{ github.event_name }}" = "push" ] || [ "$VERSION" = "latest" ]; then
            UPDATE_LATEST=true
          else
            UPDATE_LATEST=false
          fi
 
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "update_latest=$UPDATE_LATEST" >> $GITHUB_OUTPUT

  build:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: 
        target:
          - windows
          - macos
          - android
          - ios
        arch:
          - x86_64
          - arm64

    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            GEODE_SDK_VERSION=${{ needs.version.outputs.version }}
          context: .
          target: geode-sdk-${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=prevter/geode-sdk,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [version, build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - windows
          - macos
          - android
          - ios

    name: Merge manifest for ${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS=""

          if [ "${{ needs.version.outputs.update_latest }}" = "true" ]; then
            TAGS="$TAGS -t prevter/geode-sdk:${{ matrix.target }}"
            TAGS="$TAGS -t ghcr.io/prevter/geode-sdk:${{ matrix.target }}"
          fi

          TAGS="$TAGS -t prevter/geode-sdk:${{ matrix.target }}-${{ needs.version.outputs.version }}"
          TAGS="$TAGS -t ghcr.io/prevter/geode-sdk:${{ matrix.target }}-${{ needs.version.outputs.version }}"
 
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
            $(printf 'prevter/geode-sdk@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect prevter/geode-sdk:${{ matrix.target }}-${{ needs.version.outputs.version }}