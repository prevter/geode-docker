name: Build Docker Images

on:
  # push:
  #   paths:
  #     - 'Dockerfile'
  #     - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Geode CLI version override"
        required: false
        default: ""

jobs:
  version:
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      cli_version: ${{ steps.parse.outputs.cli_version }}
      is_default: ${{ steps.parse.outputs.is_default }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Geode CLI version
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VERSION="${{ inputs.cli_version }}"
          else
            INPUT_VERSION="latest"
          fi

          if [ -z "$INPUT_VERSION" ] || [ "$INPUT_VERSION" = "latest" ]; then
            RESOLVED_VERSION=$(curl -fsSL https://api.github.com/repos/geode-sdk/cli/releases/latest | jq -er '.tag_name' | sed 's/^v//')
            IS_DEFAULT=true
          else
            RESOLVED_VERSION="$INPUT_VERSION"
            IS_DEFAULT=false
          fi

          echo "cli_version=$RESOLVED_VERSION" >> $GITHUB_OUTPUT
          echo "is_default=$IS_DEFAULT" >> $GITHUB_OUTPUT

  build-tools:
    name: Build Tools (${{ matrix.target }} - ${{ matrix.arch }})
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - windows
          - macos
          - android
          - ios
        arch:
          - x86_64
          - arm64

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            GEODE_CLI_VERSION=${{ needs.version.outputs.cli_version }}
          context: .
          target: geode-tools-${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tools,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tools-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tools-${{ matrix.target }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-tools-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge-tools:
    needs: [version, build-tools]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - windows
          - macos
          - android
          - ios

    name: Merge manifest for tools-${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-tools-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          REPO="ghcr.io/${{ env.REGISTRY_OWNER }}"
          TARGET="${{ matrix.target }}"
          CLI_VERSION="${{ needs.version.outputs.cli_version }}"
          IS_DEFAULT="${{ needs.version.outputs.is_default }}"

          TAGS="-t ${REPO}/tools:${TARGET}-${CLI_VERSION}"

          if [ "${{ needs.version.outputs.is_default }}" = "true" ]; then
            TAGS="$TAGS -t ${REPO}/tools:${TARGET}"
          fi

          docker buildx imagetools create $TAGS \
            $(printf '${REPO}/tools@sha256:%s ' *)